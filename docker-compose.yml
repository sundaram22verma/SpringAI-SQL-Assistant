services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-ai-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/SQL_Assistant
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password}
      - SPRING_AI_OPENAI_API_KEY=${GROQ_API_KEY}
      - SPRING_AI_OPENAI_BASE_URL=https://api.groq.com/openai
      - SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL=llama-3.3-70b-versatile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G

  db:
    image: mysql:8.0
    container_name: spring-ai-db
    environment:
      - MYSQL_DATABASE=SQL_Assistant
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./spring_ai_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
